version: 2
models:
  - name: stg_customers
    columns:
      - name: customer_id
        data_tests: [not_null, unique]
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id
  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
  - name: stg_events
    columns:
      - name: event_id
        data_tests: [not_null, unique]
  - name: fact_order_items
    columns:
      - name: order_item_id
        data_tests: [not_null, unique]
      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_id
      - name: product_version_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_version_id
  - name: fact_orders
    columns:
      - name: order_id
        data_tests: [not_null, unique]
  - name: dim_product
    columns:
      - name: product_version_id
        data_tests: [not_null, unique]
  - name: dim_date
    columns:
      - name: date_key
        data_tests: [not_null, unique]
  - name: mart_daily_sales
    columns:
      - name: order_date
        data_tests: [not_null, unique]
