x-airflow-common: &airflow-common
  image: dataflow:local
  build: .
  env_file: .env
  environment: &airflow-env
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow}@postgres/airflow
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_SECRET_KEY:-local-only-change-me}
    DATAFLOW_PG_DSN: postgresql://dataflow:${POSTGRES_PASSWORD:-dataflow}@postgres/dataflow
    DATAFLOW_ROOT: /opt/dataflow
    DBT_PROFILES_DIR: /opt/dataflow/dbt_project
  volumes:
    - ./:/opt/dataflow
    - ./dags:/opt/airflow/dags:ro
    - ./logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dataflow}
      POSTGRES_DB: postgres
      DATAFLOW_PASSWORD: ${POSTGRES_PASSWORD:-dataflow}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow}
    ports:
      - "127.0.0.1:${DATAFLOW_PG_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./infra/source.sql:/docker-entrypoint-initdb.d/source.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      retries: 20

  airflow-init:
    <<: *airflow-common
    command: ["bash", "-c", "airflow db migrate"]

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "127.0.0.1:${DATAFLOW_AIRFLOW_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
